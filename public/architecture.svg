<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">RAG Inspector local architecture</title>
  <desc id="desc">A local browser, FastAPI and supporting embedding, Qdrant and Ollama services connected in a visible RAG pipeline.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101827"/><stop offset="1" stop-color="#172338"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7c3aed"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#059669"/><stop offset="1" stop-color="#34d399"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".28"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#94a3b8"/></marker>
  </defs>
  <rect width="1400" height="720" rx="28" fill="url(#bg)"/>
  <text x="72" y="76" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="32" font-weight="700">RAG Inspector · local architecture</text>
  <text x="72" y="110" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="17">Every boundary is inspectable. Documents, embeddings, retrieval and generation stay on the machine.</text>

  <rect x="72" y="172" width="230" height="150" rx="18" fill="#172338" stroke="#334155" filter="url(#shadow)"/>
  <text x="104" y="218" fill="#7dd3fc" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700">USER DEVICE</text>
  <text x="104" y="255" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700">React UI</text>
  <text x="104" y="284" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="15">Playground · inspectors</text>

  <path d="M302 247H390" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="316" y="232" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="13">/api proxy</text>

  <rect x="390" y="150" width="300" height="210" rx="18" fill="url(#blue)" filter="url(#shadow)"/>
  <text x="426" y="198" fill="#dbeafe" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700">APPLICATION API</text>
  <text x="426" y="238" fill="white" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="700">FastAPI</text>
  <text x="426" y="275" fill="#e0f2fe" font-family="Inter,Arial,sans-serif" font-size="15">extract · clean · chunk</text>
  <text x="426" y="301" fill="#e0f2fe" font-family="Inter,Arial,sans-serif" font-size="15">retrieve · context · evaluate</text>
  <text x="426" y="327" fill="#e0f2fe" font-family="Inter,Arial,sans-serif" font-size="15">orchestrate generation</text>

  <path d="M690 205H805" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M690 305H805" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="712" y="190" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="13">embed</text>
  <text x="712" y="290" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="13">search / store</text>

  <rect x="805" y="150" width="230" height="100" rx="18" fill="url(#violet)" filter="url(#shadow)"/>
  <text x="840" y="193" fill="#f5f3ff" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700">EMBEDDINGS</text>
  <text x="840" y="224" fill="white" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700">BGE-M3 · local</text>
  <rect x="805" y="270" width="230" height="100" rx="18" fill="#334155" filter="url(#shadow)"/>
  <text x="840" y="313" fill="#c4b5fd" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700">VECTOR STORE</text>
  <text x="840" y="344" fill="white" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700">Qdrant · Docker</text>

  <path d="M1035 255H1135" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1135" y="180" width="205" height="150" rx="18" fill="url(#green)" filter="url(#shadow)"/>
  <text x="1170" y="224" fill="#d1fae5" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700">GENERATION</text>
  <text x="1170" y="264" fill="white" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700">Ollama</text>
  <text x="1170" y="294" fill="#ecfdf5" font-family="Inter,Arial,sans-serif" font-size="15">local LLM · streamed</text>

  <rect x="160" y="470" width="1080" height="150" rx="22" fill="#0b1220" stroke="#334155"/>
  <text x="200" y="516" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">Visible request path</text>
  <text x="200" y="558" fill="#7dd3fc" font-family="JetBrains Mono,monospace" font-size="17">question</text><text x="300" y="558" fill="#94a3b8" font-family="JetBrains Mono,monospace" font-size="17">→ query embedding → Qdrant top-K → context budget → prompt</text>
  <text x="200" y="590" fill="#86efac" font-family="JetBrains Mono,monospace" font-size="17">answer</text><text x="300" y="590" fill="#94a3b8" font-family="JetBrains Mono,monospace" font-size="17">← Ollama generation ← validated [SOURCE_n] citations</text>
</svg>
